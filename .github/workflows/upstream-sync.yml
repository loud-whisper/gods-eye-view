name: Preserve upstream repository

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upstream-sync.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preserve-upstream
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Create preservation snapshot
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/bilawalsidhu/gods-eye-view.git
          DESTINATION_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          git clone --depth=1 "$UPSTREAM_URL" source
          upstream_sha="$(git -C source rev-parse HEAD)"

          git clone "$DESTINATION_URL" backup
          cd backup

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin 'refs/heads/upstream/main' >/dev/null 2>&1; then
            git checkout -B upstream/main origin/upstream/main
          else
            git checkout --orphan upstream/main
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            ../source/ ./

          rm -rf _upstream_workflows
          if [ -d ../source/.github/workflows ]; then
            mkdir -p _upstream_workflows
            cp -a ../source/.github/workflows/. _upstream_workflows/
          fi

          {
            echo "Upstream: https://github.com/bilawalsidhu/gods-eye-view"
            echo "Upstream commit: $upstream_sha"
            echo "Preserved at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Note: upstream .github/workflows files are preserved under _upstream_workflows because GitHub blocks Actions tokens from writing third-party workflow files directly."
          } > UPSTREAM_BACKUP_INFO.txt

          git ls-remote --tags "$UPSTREAM_URL" > UPSTREAM_TAGS.txt

          git add -A
          if git diff --cached --quiet; then
            echo "Backup already matches upstream commit $upstream_sha"
            exit 0
          fi

          git commit -m "Preserve upstream $upstream_sha"
          git push origin upstream/main

      - name: Preservation policy
        shell: bash
        run: |
          echo 'The backup branch is only updated after a successful upstream clone.'
          echo 'If upstream disappears or becomes unreachable, this job fails before modifying the preserved branch.'
